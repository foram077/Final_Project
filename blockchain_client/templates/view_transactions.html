<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>View Ledger - Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/vendor/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/vendor/DataTables/css/datatables.min.css">
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#">Library Ledger</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ml-auto">
        <li class="nav-item"><a class="nav-link" href="/">Wallet Generator</a></li>
        <li class="nav-item"><a class="nav-link" href="/make/transaction">Record Lending</a></li>
        <li class="nav-item active"><a class="nav-link" href="/view/transactions">View Ledger</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container" style="margin-top:80px;">
  <h3>View Lending Transactions</h3>
  <div class="form-inline mb-3">
    <input id="node_url" class="form-control mr-2" style="width:350px" value="http://127.0.0.1:5001">
    <button id="view_transactions" class="btn btn-primary mr-2">View Ledger</button>
    <button id="mine_now" class="btn btn-warning">Mine Now (pack pending)</button>
  </div>

  <table id="transactions_table" class="table table-striped table-bordered" style="width:100%">
    <thead>
      <tr><th>#</th><th>Student ID</th><th>Book ID</th><th>Action</th><th>Timestamp (UTC)</th><th>Block / Status</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script src="/static/vendor/jquery/jquery.min.js"></script>
<script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="/static/vendor/DataTables/js/datatables.min.js"></script>

<script>
$(function(){
  const $nodeUrl = $('#node_url');
  const $viewBtn = $('#view_transactions');
  const $mineBtn = $('#mine_now');
  const $table = $('#transactions_table');

  function normalizeTx(t) {
    return {
      student: (t.student_id || t.student || '').toString(),
      book: (t.book_id || t.book || '').toString(),
      action: (t.action || '').toString().toLowerCase(),
      timestamp: t.timestamp || null
    };
  }

  function formatTimestamp(ts) {
    if (!ts) return '';
    if (typeof ts === 'number') return new Date(ts * 1000).toISOString();
    if (!isNaN(Number(ts))) return new Date(Number(ts) * 1000).toISOString();
    const d = new Date(ts);
    return isNaN(d.getTime()) ? ts : d.toISOString();
  }

  async function fetchChainAndPending() {
    const node = $nodeUrl.val().trim();
    if (!node) { alert('Enter node URL'); return; }
    try {
      let pendingList = [];
      try {
        const pResp = await fetch(node + '/transactions/get');
        if (pResp.ok) {
          const pJson = await pResp.json();
          pendingList = pJson.transactions || [];
        }
      } catch(e){ console.warn('/transactions/get failed', e); }

      const cResp = await fetch(node + '/chain');
      if (!cResp.ok) {
        const txt = await cResp.text();
        throw new Error('Failed to fetch chain: ' + cResp.status + ' ' + txt);
      }
      const chainObj = await cResp.json();
      const chain = chainObj.chain || [];

      const rows = [];
      let counter = 1;

      for (const t of pendingList) {
        const nt = normalizeTx(t);
        if (!nt.student && !nt.book) continue;
        if (nt.action === 'reward') continue;
        rows.push([counter++, nt.student, nt.book, nt.action, formatTimestamp(nt.timestamp), 'PENDING']);
      }

      for (let i = 0; i < chain.length; i++) {
        const block = chain[i];
        const blockNum = block.block_number !== undefined ? block.block_number : i;
        const txs = block.transactions || [];
        for (const t of txs) {
          const nt = normalizeTx(t);
          if (!nt.student && !nt.book) continue;
          if (nt.action === 'reward') continue;
          rows.push([counter++, nt.student, nt.book, nt.action, formatTimestamp(nt.timestamp || block.timestamp), 'Block ' + blockNum]);
        }
      }

      try { $table.DataTable().clear().destroy(); } catch(e){}
      $table.DataTable({
        data: rows,
        columns: [
          {title:"#"}, {title:"Student ID"}, {title:"Book ID"}, {title:"Action"}, {title:"Timestamp (UTC)"}, {title:"Block / Status"}
        ],
        ordering:true, pageLength:25
      });

    } catch(err) {
      console.error(err);
      alert('Error loading ledger: ' + (err.message || err));
    }
  }

  $viewBtn.on('click', function(){ fetchChainAndPending(); });
  $mineBtn.on('click', async function(){
    const node = $nodeUrl.val().trim();
    if (!node) { alert('Enter node URL'); return; }
    try {
      const resp = await fetch(node + '/mine');
      if (!resp.ok) {
        const txt = await resp.text();
        alert('Mine failed: ' + resp.status + ' ' + txt);
        return;
      }
      await fetchChainAndPending();
      alert('Mine success — pending transactions were packed into a block.');
    } catch(e) { alert('Mine request failed: ' + e.message); }
  });

  fetchChainAndPending();
  setInterval(fetchChainAndPending, 10000);
});
</script>

</body>
</html>
